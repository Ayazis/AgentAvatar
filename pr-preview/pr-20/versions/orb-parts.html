<!doctype html>
<meta charset="utf-8">
<title>Orb parts – motion prototype</title>
<style>
  body { margin: 0; background: #15161b; color: #ccc; font: 13px system-ui, sans-serif; display: flex; height: 100vh; }
  canvas { flex: 1; min-width: 0; }
  #ui { width: 230px; padding: 14px; background: #1d1f26; overflow-y: auto; }
  #ui h3 { margin: 4px 0 10px; font-size: 14px; color: #eee; }
  .states button { margin: 0 4px 6px 0; padding: 5px 9px; background: #2b2e38; color: #ddd; border: 1px solid #3a3e4a; border-radius: 4px; cursor: pointer; }
  .states button.on { background: #b8742c; color: #fff; border-color: #b8742c; }
  label { display: block; margin: 9px 0 2px; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
</style>
<canvas id="c"></canvas>
<div id="ui">
  <h3>State</h3>
  <div class="states" id="states"></div>
  <h3>Tune</h3>
  <div id="sliders"></div>
  <h3>Layers</h3>
  <div id="toggles"></div>
</div>
<script>
// Orb assembled from assets/orb-parts/ (split by tools/split_orb_parts.py). All coordinates are in the 1254 source canvas.
const C = 627;  // centre of the source canvas
const parts = {};
const NAMES = ['ring-steel-face','ring-bronze-face','gear-large','gear-pinion-face','bearing-face','shaft','core',
  'blade-top','blade-left','blade-top-right','blade-bottom-right','blade-bottom-left'];
const BLADES = NAMES.filter(n => n.startsWith('blade'));

// state presets: what each mood drives toward; the live values ease toward these
const STATES = {
  off:      { open: 0,   spin: 0,   glow: .05, pulse: 0,   gimbal: 0 },
  idle:     { open: .08, spin: .25, glow: .55, pulse: .35, gimbal: .3 },
  thinking: { open: .35, spin: 1.2, glow: .8,  pulse: .5,  gimbal: 1 },
  talking:  { open: .7,  spin: .6,  glow: 1,   pulse: 1,   gimbal: .6 },
};
const tune = { openDist: 110, openTurn: 10, shellSpin: 1, gearSize: 1.35, ringSize: 1.45, coreSize: 1.55, bearingSize: 1.2 };
const show = { shaft: false, bearing: true, gears: true, rings: true, blades: true, glow: true };
let target = STATES.idle, live = { ...STATES.idle }, stateName = 'idle';

// ---- UI
const statesEl = document.getElementById('states');
for (const s in STATES) {
  const b = document.createElement('button'); b.textContent = s;
  b.onclick = () => { target = STATES[s]; stateName = s; [...statesEl.children].forEach(x => x.classList.toggle('on', x === b)); };
  if (s === 'idle') b.classList.add('on');
  statesEl.append(b);
}
const RANGES = { openDist: [0, 300], openTurn: [0, 40], shellSpin: [0, 4], gearSize: [.5, 2.5], ringSize: [.5, 2.5], coreSize: [.5, 3], bearingSize: [.4, 2] };
for (const k in RANGES) {
  const l = document.createElement('label'), i = document.createElement('input');
  i.type = 'range'; i.min = RANGES[k][0]; i.max = RANGES[k][1]; i.step = .01; i.value = tune[k];
  const upd = () => { tune[k] = +i.value; l.textContent = `${k}: ${(+i.value).toFixed(2)}`; };
  i.oninput = upd; upd();
  document.getElementById('sliders').append(l, i);
}
for (const k in show) {
  const r = document.createElement('label'); r.className = 'row';
  r.innerHTML = `<input type=checkbox ${show[k] ? 'checked' : ''}> ${k}`;
  r.firstChild.onchange = e => show[k] = e.target.checked;
  document.getElementById('toggles').append(r);
}

// ---- drawing helpers
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function resize() { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; }
addEventListener('resize', resize);

// draw a part centred on (x, y) in source space, rotated and scaled; sx/sy allow a fake tilt
function draw(name, x, y, rot = 0, s = 1, sy = 1, alpha = 1) {
  const p = parts[name], img = p.img;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s * sy); ctx.globalAlpha = alpha;
  ctx.drawImage(img, -p.w / 2, -p.h / 2);
  ctx.restore();
}

// a gimbal ring: half behind the core, half in front. The ring art is already an ellipse, so we spin it in-plane
// and breathe its height for a fake tilt; `front` picks which half (local y > 0) to draw.
// Face-on ring art, tilted for real: `axis` turns slowly, the ring is squashed across it (cos of the tilt), and the
// art spins in its own plane so the rivets travel round. Local y > 0 is the near half, drawn in front of the core.
function ring(name, t, speed, phase, front) {
  const p = parts[name], s = tune.ringSize * 700 / p.w;
  const axis = phase + t * speed * .12;
  const tilt = 1.05 + .35 * live.gimbal * Math.sin(t * speed * .5 + phase);   // radians away from face-on
  const spinIn = t * speed * .4 * (.3 + live.gimbal);
  ctx.save(); ctx.translate(C, C); ctx.rotate(axis);
  ctx.beginPath(); if (front) ctx.rect(-2000, 0, 4000, 2000); else ctx.rect(-2000, -2000, 4000, 2000); ctx.clip();
  ctx.scale(s, s * Math.abs(Math.cos(tilt))); ctx.rotate(spinIn);
  ctx.drawImage(p.img, -p.w / 2, -p.h / 2);
  ctx.restore();
}

function glow(x, y, r, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,200,110,${a})`); g.addColorStop(.35, `rgba(255,140,40,${a * .45})`); g.addColorStop(1, 'rgba(255,120,20,0)');
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}

// ---- frame
let last = performance.now(), T = 0, gearAngle = 0, shellAngle = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const k in live) live[k] += (target[k] - live[k]) * (1 - Math.exp(-dt * 3));
  T += dt * (.3 + live.spin);
  gearAngle += dt * live.spin * .5;
  shellAngle += dt * live.spin * .06 * tune.shellSpin;

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  const k = Math.min(cv.width, cv.height) / 1254 * .92;
  ctx.setTransform(k, 0, 0, k, cv.width / 2 - C * k, cv.height / 2 - C * k);

  // pulse: slow breath, plus a faster flutter when talking
  const breath = .5 + .5 * Math.sin(T * 1.6);
  const flutter = stateName === 'talking' ? .5 + .5 * Math.sin(T * 9) * Math.sin(T * 3.3) : 0;
  const pulse = live.pulse * (.6 * breath + .4 * flutter);

  if (show.shaft) draw('shaft', C, C, -.1, 1.6, 1, .9);
  if (show.gears) {
    const g = tune.gearSize, rg = 200 * g;           // big gear's outer radius ~200 px at size 1
    draw('gear-large', C, C, gearAngle, g, 1, .85);
    // pinion meshes at the lower right, turning the other way 36/14 times as fast
    const ang = .75, ps = g * .34, rp = 240 * ps;   // face-on pinion art is ~480 px across
    draw('gear-pinion-face', C + Math.cos(ang) * (rg + rp * .82), C + Math.sin(ang) * (rg + rp * .82), -gearAngle * 36 / 14, ps);
  }
  if (show.rings) { ring('ring-steel-face', T, 1, 0, false); ring('ring-bronze-face', T, -1.4, 2, false); }
  if (show.bearing) draw('bearing-face', C, C + 4, 0, tune.bearingSize);   // its bore sits on the core
  if (show.glow) glow(C, C, 260 * tune.coreSize * (.7 + .3 * pulse), live.glow * (.35 + .5 * pulse));
  draw('core', C, C, 0, tune.coreSize * (1 + .04 * pulse));
  if (show.glow) glow(C, C, 70 * tune.coreSize, live.glow * (.4 + .6 * pulse));
  if (show.rings) { ring('ring-steel-face', T, 1, 0, true); ring('ring-bronze-face', T, -1.4, 2, true); }

  if (show.blades) {
    const open = live.open + .05 * live.pulse * breath;
    for (const [i, b] of BLADES.entries()) {
      const p = parts[b], dx = p.cx - C, dy = p.cy - C, d = Math.hypot(dx, dy) || 1;
      const push = open * tune.openDist * (1 + .15 * Math.sin(i * 2.1));   // each blade a touch different
      // rotate the rest position around the centre with the shell, then push outward
      const ca = Math.cos(shellAngle), sa = Math.sin(shellAngle);
      const rx = dx * ca - dy * sa, ry = dx * sa + dy * ca;
      draw(b, C + rx + rx / d * push, C + ry + ry / d * push, shellAngle + open * tune.openTurn * Math.PI / 180);
    }
  }
  requestAnimationFrame(frame);
}

fetch('../assets/orb-parts/parts.json').then(r => r.json()).then(async meta => {
  await Promise.all(NAMES.map(n => new Promise(res => {
    const img = new Image(); img.onload = res; img.src = `../assets/orb-parts/${n}.png`;
    parts[n] = { ...meta[n], img };
  })));
  resize(); requestAnimationFrame(frame);
});
</script>
