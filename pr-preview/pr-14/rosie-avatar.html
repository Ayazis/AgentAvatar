<!-- Rosie | source and offline preview
Open this file in a WebGL 2 browser. All geometry, shading and motion live in
the first script. The second script is the removable standalone preview UI.
To reuse the renderer, copy the first script and give RosieAvatar a square canvas.

Application integration:
  const avatar = new RosieAvatar(canvas);
  avatar.setView('status', true);     // status + high detail, or header + false
  avatar.setBusy(false);             // fold into sleep; true resumes work
  avatar.setPose(2.4, 0.65);         // deterministic sample for external capture
  avatar.dispose();                   // release GPU objects, callbacks, observers

Capture: set the canvas CSS width to your target output size; the HD profile
caps its drawing buffer at 1280 pixels. For a seamless 12-second busy loop at
24 fps, sample frame 0 through 287 using avatar.setPose(frame / 24, 1).
Sample immediately after the call. Openness runs from 0 (asleep) to 1 (busy).
The header targets 15 fps and status targets 30 fps. These are caps, not
measured guarantees. GPU acceleration and WebGL 2 availability depend on host.
-->

function program(gl,vertex,fragment){
  const shaders=[];

    for(const [type,src] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]){

      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
      gl.attachShader(p,s);
    }
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  }catch(e){gl.deleteProgram(p);throw e;}finally{shaders.forEach(s=>gl.deleteShader(s));}
  return p;
}

  sizes.forEach((n,i)=>{gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,n,gl.FLOAT,false,60,offset*4);offset+=n;});

}

  setPose(phaseSeconds,openness){

    this.stop();this.manual=true;this.time=(phaseSeconds%12+12)%12;this.amount=clamp(openness);
    this.draw(this.time,this.amount);
  }
  setView(placement,highDetail=false){
    this.placement=placement==='header'?'header':'status';
    this.hd=Boolean(highDetail);this.resetClock();
  }
  stop(){cancelAnimationFrame(this.request);this.request=0;this.last=null;}
  invalidate(){
    if(this.disposed||this.request||document.hidden||!this.inView||this.gl.isContextLost())return;
    this.request=requestAnimationFrame(t=>this.tick(t));
  }
  tick(t){
    this.request=0;
    const period=1000/(this.placement==='header'?15:30);
    if(this.last!==null&&t-this.last<period-.75){this.invalidate();return;}
    const dt=this.last===null?0:Math.min(.15,(t-this.last)/1000);
    this.last=t;
    if(this.manual){this.draw(this.time,this.amount);this.last=null;return;}
    if(this.query.matches)this.amount=this.target;
    else {
      const distance=this.target-this.amount;
      this.amount+=Math.sign(distance)*Math.min(Math.abs(distance),dt/(this.target?1.15:1.65));
      this.time=(this.time+dt*smooth(this.amount))%12;
    }
    this.draw(this.time,this.amount);
    if(!this.query.matches&&(this.target===1||this.amount!==this.target))this.invalidate();
    else this.last=null;
  }
  // Deterministic entry point for frame capture. phaseSeconds wraps every 12 s.
  draw(phaseSeconds,openness){
    const gl=this.gl, header=this.placement==='header', hd=this.hd&&!header;
    const px=Math.max(1,Math.min(header?144:hd?1280:540,Math.round(this.canvas.clientWidth*Math.min(devicePixelRatio,hd?2:1.5))));
    if(this.canvas.width!==px||this.canvas.height!==px){this.canvas.width=px;this.canvas.height=px;}
    gl.viewport(0,0,px,px);gl.clearColor(0,0,0,0);gl.clearDepth(1);
    gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const awake=smooth(openness),drop=-.20*(1-awake);
    const u=this.uniform;gl.useProgram(this.surface);
    gl.uniform1f(u.awake,awake);gl.uniform1f(u.detail,header?.25:hd?1:.7);
    const drawPart=(part,tilt,phase,scale,y,cloth)=>{
      gl.uniform3fv(u.tilt,tilt);gl.uniform1f(u.phase,phase);gl.uniform1f(u.scale,scale);
      gl.uniform1f(u.drop,y);gl.uniform1f(u.cloth,cloth);gl.bindVertexArray(part.vao);
      gl.drawElements(gl.TRIANGLES,part.count,gl.UNSIGNED_INT,0);
    };
    this.parts.forEach((p,i)=>{
      const inset=mix(.31+(i%3)*.016,1,awake);
      drawPart(p,p.tilt,phaseSeconds/12*TAU*p.turns,inset,drop,0);
    });
    drawPart(this.scarf,[0,0,0],0,1,0,1);
    const s=this.particleUniform;gl.useProgram(this.points);
    gl.uniform1f(s.time,phaseSeconds);gl.uniform1f(s.awake,awake);gl.uniform1f(s.pixels,px);
    gl.uniform1f(s.scale,mix(.31,1,awake));gl.uniform1f(s.drop,drop);
    gl.bindVertexArray(this.stars);gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);gl.drawArrays(gl.POINTS,0,header?520:hd?3040:2080);
    gl.depthMask(true);gl.disable(gl.BLEND);gl.bindVertexArray(null);
    this.frames++;
    this.onFrame?.(this);
  }
  dispose(){
    this.stop();this.disposed=true;this.observer.disconnect();this.intersection.disconnect();
    document.removeEventListener('visibilitychange',this.resetClock);
    this.query.removeEventListener('change',this.resetClock);
    this.canvas.removeEventListener('webglcontextlost',this.onLoss);
    this.canvas.removeEventListener('webglcontextrestored',this.onRestore);
    const gl=this.gl;
    for(const p of [...this.parts,this.scarf]){
      gl.deleteBuffer(p.vbo);gl.deleteBuffer(p.ibo);gl.deleteVertexArray(p.vao);
    }
    gl.deleteBuffer(this.seeds);gl.deleteVertexArray(this.stars);
    gl.deleteProgram(this.surface);gl.deleteProgram(this.points);
  }
}
window.RosieAvatar=RosieAvatar;

</script><script>
const ui=Object.fromEntries(Array.from(document.querySelectorAll('[id]'),el=>[el.id,el]));
try{
 const avatar=new RosieAvatar(ui.avatar);
 window.rosie=avatar;
 let headerMode=false,needsStill=true;
 const ctx=ui.still.getContext('2d');
 try{ui.hd.checked=localStorage.getItem('rosie.hd')==='1';}catch{}
 avatar.onFrame=()=>{
   if(needsStill&&!headerMode && avatar.amount===avatar.target){
     ctx.clearRect(0,0,144,144);ctx.drawImage(ui.avatar,0,0,144,144);needsStill=false;
   }
 };
 function selectView(header){
   headerMode=header;
   (header?ui.small:ui.stage).appendChild(ui.avatar);
   ui.stage.hidden=header;ui.still.hidden=header;ui.hd.disabled=header;
   ui.page.setAttribute('aria-pressed',!header);ui.header.setAttribute('aria-pressed',header);
   needsStill=true;avatar.setView(header?'header':'status',ui.hd.checked);
 }
 function activity(busy){
   ui.busy.setAttribute('aria-pressed',busy);ui.sleep.setAttribute('aria-pressed',!busy);
   ui.stateLabel.textContent=busy?'Busy':'Asleep';needsStill=true;avatar.setBusy(busy);
 }
 ui.busy.onclick=()=>activity(true);ui.sleep.onclick=()=>activity(false);
 ui.page.onclick=()=>selectView(false);ui.header.onclick=()=>selectView(true);
 ui.hd.onchange=()=>{try{localStorage.setItem('rosie.hd',ui.hd.checked?'1':'0');}catch{}selectView(headerMode);};
 selectView(false);
}catch(err){ui.error.hidden=false;ui.error.textContent=err.message;document.querySelectorAll('button,input').forEach(el=>el.disabled=true);console.error(err);}
</script></body></html>
