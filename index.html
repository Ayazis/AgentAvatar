<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rosie · Particle orb</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/panel.css">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">import(`./src/main.js?v=${Date.now()}`);</script>
</head>
<body>
<div class="stage"><canvas id="c" aria-label="A shell of glowing denim plates around a burning particle core, floating above a knotted denim scarf"></canvas></div>

<div class="panel">
  <h1>Rosie <span>· particle orb</span></h1>
  <div class="states">
    <button data-state="off">Off</button>
    <button data-state="idle" class="on">Idle</button>
    <button data-state="working">Working</button>
  </div>
  <div class="editing">Editing the <b id="editing">Idle</b> preset</div>
  <div id="controls"></div>   <!-- built by src/ui/panel.js from src/ui/controls.js -->
  <div class="actions">
    <button id="resetState" type="button">Reset this state</button>
    <button id="resetAll" type="button">Reset all</button>
    <button id="copySettings" type="button">Copy settings</button>
  </div>
  <div class="hint">Keys 1 · 2 · 3 switch state. Drag to turn the orb. <a href="versions/">All versions</a></div>
</div>
</body>
</html>
