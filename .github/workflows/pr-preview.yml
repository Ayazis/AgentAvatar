# Deploys a preview of each pull request to
# https://ayazis.github.io/AgentAvatar/pr-preview/pr-<number>/ and removes it when the PR closes.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect runtime files
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          cp index.html rosie-avatar.html rosie-fold.html _site/
          cp -r src styles _site/
          rsync -a --exclude 'source/' assets/ _site/assets/
          touch _site/.nojekyll

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
