# Publishes the site to gh-pages on every push to main, and a preview
# of each pull request under /pr-preview/pr-N/.
# GitHub Pages serves gh-pages at https://ayazis.github.io/AgentAvatar/
name: Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect runtime files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src styles _site/
          rsync -a --exclude 'source/' assets/ _site/assets/
          touch _site/.nojekyll

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          keep_files: true   # keep pr-preview/ folders
          commit_message: "Deploy ${{ github.sha }}"
